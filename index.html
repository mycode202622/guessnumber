<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-family: sans-serif;
        }

        body {
            width: 75%;
            margin-inline: auto;
            border: 1px black solid;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Гра вгадай число</h1>
    <p>Введіть число від 1 до 100</p>
    <div class="form">
        <label for="guessfield">Введіть число</label>
        <input type="number" id="guessfield" class="guessfield" min="1" max="100">
        <button class="guess-submit">Надіслати</button>
    </div>
    <div class="result-params">
        <p class="guesses"></p>
        <p class="last-result"></p>
        <p class="low-or-high"></p>
    </div>


    <script src="./script.js"></script>
    
</body>
</html>
